<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <script>
      const splashTheme = new URLSearchParams(location.search).get('theme')
      document.documentElement.dataset.theme = splashTheme === 'dark' ? 'dark' : 'light'
      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.documentElement.dataset.platform = 'windows'
      }
    </script>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #17181a; background: #f8f8f6; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 10px;
        padding: 32px;
        text-align: center;
      }
      html[data-platform="windows"] main { padding-top: 70px; }
      .brand {
        width: 116px;
        height: 116px;
        display: grid;
        place-items: center;
        margin-bottom: 4px;
      }
      .brand img { width: 100%; height: 100%; object-fit: contain; }
      .brand .darkLogo { display: none; }
      .eyebrow { margin: 0 0 1px; color: #cf0a2c; font-size: 10px; font-weight: 750; letter-spacing: .15em; }
      .title { margin: 0; font-size: 23px; font-weight: 680; letter-spacing: -0.025em; }
      .status { margin: -2px 0 0; color: #777a80; font-size: 12px; }
      .progress { width: 138px; height: 3px; margin-top: 9px; overflow: hidden; border-radius: 999px; background: rgba(127,127,127,.18); }
      .progress::after { content: ''; display: block; width: 42%; height: 100%; border-radius: inherit; background: #cf0a2c; animation: loading 1.2s ease-in-out infinite alternate; }
      @keyframes loading { from { transform: translateX(-92%); } to { transform: translateX(235%); } }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      :root[data-theme='dark'] body {
        color: #f3f4f6;
        background: #141416;
      }
      :root[data-theme='dark'] .status {
        color: #9ca0a8;
      }
      :root[data-theme='dark'] .brand .lightLogo { display: none; }
      :root[data-theme='dark'] .brand .darkLogo { display: block; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) body { color: #f3f4f6; background: #141416; }
        :root:not([data-theme]) .status { color: #9ca0a8; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img class="lightLogo" src="splash-logo-light.png" alt="" />
        <img class="darkLogo" src="splash-logo-dark.png" alt="" />
      </div>
      <p class="eyebrow">PANGEA TEST PLATFORM</p>
      <h1 class="title" id="title">PANGEA 测试工作台</h1>
      <p class="status" id="status">正在准备测试插件与当前工作区…</p>
      <div class="progress" aria-hidden="true"></div>
    </main>
    <script>
      if (navigator.language.toLowerCase().startsWith('zh')) {
        document.getElementById('title').textContent = 'PANGEA 测试工作台'
      } else {
        document.getElementById('title').textContent = 'PANGEA Test Workbench'
        document.getElementById('status').textContent = 'Preparing test plugins and the current workspace…'
      }
    </script>
  </body>
</html>
