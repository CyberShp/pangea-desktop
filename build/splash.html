<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <script>
      const splashTheme = new URLSearchParams(location.search).get('theme')
      document.documentElement.dataset.theme = splashTheme === 'dark' ? 'dark' : 'light'
      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.documentElement.dataset.platform = 'windows'
      }
    </script>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #17181a; background: #f8f8f6; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        padding: 32px;
        text-align: center;
      }
      html[data-platform="windows"] main { padding-top: 70px; }
      .markFrame {
        width: 84px;
        height: 84px;
        display: grid;
        place-items: center;
        border-radius: 25px;
        background: linear-gradient(145deg, #172554, #312e81 52%, #0f766e);
        box-shadow: 0 18px 48px rgba(30, 41, 118, .22);
      }
      .mark {
        position: relative;
        width: 41px;
        height: 49px;
        border-left: 8px solid #e0f2fe;
        border-radius: 4px;
      }
      .mark::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        width: 28px;
        height: 25px;
        border: 8px solid #a5b4fc;
        border-left: 0;
        border-radius: 0 17px 17px 0;
      }
      .mark::after {
        content: '';
        position: absolute;
        width: 8px;
        height: 8px;
        right: -7px;
        bottom: 1px;
        border-radius: 50%;
        background: #5eead4;
        box-shadow: 0 0 0 5px rgba(94, 234, 212, .16);
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse { 50% { transform: scale(.72); opacity: .62; } }
      .title { margin: 0; font-size: 23px; font-weight: 650; letter-spacing: -0.02em; }
      .status { margin: -4px 0 0; color: #777a80; font-size: 13px; }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      :root[data-theme='dark'] body {
        color: #f3f4f6;
        background: #141416;
      }
      :root[data-theme='dark'] .markFrame { box-shadow: 0 20px 54px rgba(65, 82, 220, .2); }
      :root[data-theme='dark'] .status {
        color: #9ca0a8;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) body { color: #f3f4f6; background: #141416; }
        :root:not([data-theme]) .status { color: #9ca0a8; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="markFrame" aria-hidden="true"><span class="mark"></span></div>
      <h1 class="title" id="title">Starting PANGEA Desktop</h1>
      <p class="status" id="status">First launch may take a moment.</p>
    </main>
    <script>
      if (navigator.language.toLowerCase().startsWith('zh')) {
        document.getElementById('title').textContent = '正在启动 PANGEA Desktop'
        document.getElementById('status').textContent = '首次启动可能需要一点时间。'
      }
    </script>
  </body>
</html>
