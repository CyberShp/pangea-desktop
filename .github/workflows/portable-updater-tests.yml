name: Windows portable updater regression
on:
  workflow_dispatch:
  push:
    branches: [langgraph, fix/desktop-recovery-delivery]
    paths:
      - build/apply-portable-update.ps1
      - src/main/update/launch-portable-helper.ts
      - src/main/update/portable-update.ts
      - src/main/update/update-manager.ts
      - src/preload/index.ts
      - src/preload/update-view.ts
      - test/portable-helper-launch.test.ts
      - test/portable-helper-handoff.test.ts
      - scripts/resume-portable-update.ps1
      - scripts/verify-portable-update-progress.ps1
      - scripts/verify-portable-update-locks.ps1
      - scripts/verify-portable-patch-apply.ps1
      - scripts/verify-portable-user-data.ps1
      - scripts/verify-portable-handle-resolution.ps1
      - scripts/verify-portable-batch-cleanup.ps1
      - scripts/verify-explorer-recovery.ps1
      - .github/workflows/portable-updater-tests.yml
permissions:
  contents: read
jobs:
  updater:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows PowerShell 5.1 directory locks and rollback rename
        shell: powershell
        run: ./scripts/verify-portable-update-locks.ps1
      - name: Verify independent visible progress, responsive UI and persistent failures
        shell: powershell
        run: ./scripts/verify-portable-update-progress.ps1
      - name: Verify patch reconstruction and user data preservation
        shell: powershell
        run: ./scripts/verify-portable-patch-apply.ps1
      - name: Verify long repository paths, links and copy failures
        shell: powershell
        run: ./scripts/verify-portable-user-data.ps1
      - name: Verify automatic cleanup policies, identity guards and no blocking prompts
        shell: powershell
        run: ./scripts/verify-portable-batch-cleanup.ps1
      - name: Verify actual directory holders exit automatically and permit rename
        shell: powershell
        run: ./scripts/verify-portable-handle-resolution.ps1
      - name: Verify Explorer policy and independent recovery guard
        shell: powershell
        run: ./scripts/verify-explorer-recovery.ps1
