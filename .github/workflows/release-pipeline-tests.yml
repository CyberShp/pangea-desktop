name: Release pipeline regression
on:
  workflow_dispatch:
    inputs:
      native_zero_copy_only:
        description: Run only native zero-copy migration, lifecycle and benchmark tests
        required: false
        type: boolean
        default: false
      build_unsigned:
        description: Assemble an unsigned win-unpacked test instance from the component lock and validate it; never sign or publish
        required: false
        type: boolean
        default: false
      package_run_id:
        description: Optional successful build run whose existing portable artifact should also be tested (no build or publish)
        required: false
        type: string
  pull_request:
    paths:
      - pangea.components.json
      - test/acp-injection-delivery.test.mjs
      - scripts/fixtures/acp-diagnostic-agent.mjs
      - scripts/build-pangea-desktop.ps1
      - scripts/verify-fault-injection-compat.mjs
      - scripts/test-packaged-fault-injection.ps1
      - scripts/verify-pangea-staging.mjs
      - test/semantic-staging.test.ts
      - test/fault-injection-compat-gate.test.ts
      - .github/workflows/release*.yml
      - scripts/*release*.mjs
      - scripts/*historical*.mjs
      - scripts/create-signed-portable-package.mjs
      - scripts/create-intranet-update-index.mjs
      - test/intranet-*.test.ts
      - test/online-update.test.ts
      - test/online-update-integration.test.ts
      - scripts/create-signed-portable-patch.mjs
      - build/portable-update-policy.json
      - build/apply-portable-update.ps1
      - scripts/*portable*.ps1
      - src/main/update/**
      - src/preload/desktop-bridge.ts
      - src/preload/index.ts
      - src/preload/update-network-view.ts
      - test/desktop-bridge.test.ts
      - test/update-network*.test.ts
      - packages/dsh-pangea-product/update-admission.js
      - test/portable-*.test.ts
      - src/main/update/portable-update.ts
      - src/main/update/portable-*-validator.ts
      - test/portable-upgrade-policy.test.ts
      - test/*release*.mjs
      - test/*historical*.mjs
      - test/release.test.ts
      - test/portable-patch*.test.ts
  push:
    branches: [langgraph]
    paths:
      - pangea.components.json
      - test/acp-injection-delivery.test.mjs
      - scripts/fixtures/acp-diagnostic-agent.mjs
      - scripts/build-pangea-desktop.ps1
      - scripts/verify-fault-injection-compat.mjs
      - scripts/test-packaged-fault-injection.ps1
      - scripts/verify-pangea-staging.mjs
      - test/semantic-staging.test.ts
      - test/fault-injection-compat-gate.test.ts
      - .github/workflows/release*.yml
      - scripts/*release*.mjs
      - scripts/*historical*.mjs
      - scripts/create-signed-portable-package.mjs
      - scripts/create-intranet-update-index.mjs
      - test/intranet-*.test.ts
      - test/online-update.test.ts
      - test/online-update-integration.test.ts
      - scripts/create-signed-portable-patch.mjs
      - build/portable-update-policy.json
      - build/apply-portable-update.ps1
      - scripts/*portable*.ps1
      - src/main/update/**
      - src/preload/desktop-bridge.ts
      - src/preload/index.ts
      - src/preload/update-network-view.ts
      - test/desktop-bridge.test.ts
      - test/update-network*.test.ts
      - packages/dsh-pangea-product/update-admission.js
      - test/portable-*.test.ts
      - src/main/update/portable-update.ts
      - src/main/update/portable-*-validator.ts
      - test/portable-upgrade-policy.test.ts
      - test/*release*.mjs
      - test/*historical*.mjs
      - test/release.test.ts
      - test/portable-patch*.test.ts
permissions:
  contents: read
  actions: read
jobs:
  windows-components:
    if: inputs.native_zero_copy_only != true
    # Run the plugin checks that gate release assembly on the release OS,
    # using the exact component lock, without signing or publishing a package.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Check out the locked plugin source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Component = (Get-Content pangea.components.json -Raw | ConvertFrom-Json).dshPangea
          if ($Component.commit -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid plugin commit lock.' }
          git clone --no-checkout $Component.repository .pangea-build/plugin-source
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch locked plugin source.' }
          git -C .pangea-build/plugin-source checkout --detach $Component.commit
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out locked plugin commit.' }
          $Actual = git -C .pangea-build/plugin-source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $Actual -cne $Component.commit) { throw 'Plugin checkout differs from component lock.' }
      - name: Verify Windows fault injection compatibility through HTTP
        shell: pwsh
        run: |
          node scripts/verify-fault-injection-compat.mjs --companion .pangea-build/plugin-source/plugins/dsh-pangea-companion --require-windows --report .pangea-build/verification/fault-injection-source.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows fault injection compatibility failed.' }
      - name: Verify HTTP compatibility with longpaths already enabled
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          node scripts/verify-fault-injection-compat.mjs --companion .pangea-build/plugin-source/plugins/dsh-pangea-companion --require-windows --git-longpaths-default true --report .pangea-build/verification/fault-injection-source-enabled.json
          if ($LASTEXITCODE -ne 0) { throw 'Enabled-default Windows compatibility failed.' }
      - name: Verify the release plugin suites on Windows
        shell: pwsh
        run: |
          cc --version
          if ($LASTEXITCODE -ne 0) { throw 'The compiled fault-injection fixture requires a C compiler.' }
          foreach ($Plugin in @('dsh-pangea', 'dsh-pangea-companion', 'dsh-pangea-asset-catalog')) {
            npm --prefix ".pangea-build/plugin-source/plugins/$Plugin" test
            if ($LASTEXITCODE -ne 0) { throw "Windows plugin regression failed: $Plugin" }
          }
      - name: Verify locked Companion delivery through the shipped ACP adapter
        shell: pwsh
        run: |
          npx --no-install patch-package
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply shipped runtime patches.' }
          $env:PANGEA_TEST_COMPANION_ROOT = (Resolve-Path '.pangea-build/plugin-source/plugins/dsh-pangea-companion').Path
          node --test test/acp-injection-delivery.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ACP injection delivery regression failed.' }
      - name: Assemble unsigned Windows test instance
        if: inputs.build_unsigned == true
        shell: powershell
        run: |
          ./scripts/build-pangea-desktop.ps1 -SkipPackage
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned test staging failed.' }
          npm run package:dir
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned win-unpacked assembly failed.' }
      - name: Verify newly assembled packaged runtime with longpaths disabled
        if: inputs.build_unsigned == true
        shell: powershell
        run: |
          ./scripts/test-packaged-fault-injection.ps1 -PackageDirectory dist/win-unpacked -ReportPath .pangea-build/verification/fault-injection-packaged.json
      - name: Verify newly assembled packaged runtime with longpaths enabled
        if: ${{ !cancelled() && inputs.build_unsigned == true }}
        shell: powershell
        run: |
          ./scripts/test-packaged-fault-injection.ps1 -PackageDirectory dist/win-unpacked -GitLongpathsDefault true -ReportPath .pangea-build/verification/fault-injection-packaged-enabled.json
      - name: Retain unsigned Windows test instance
        if: inputs.build_unsigned == true
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-win-unpacked-compatibility-${{ github.run_id }}
          path: dist/win-unpacked/
          retention-days: 7
          if-no-files-found: error
      - name: Download existing portable artifact for acceptance
        if: ${{ !cancelled() && inputs.package_run_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          if ($env:PACKAGE_RUN_ID -notmatch '^\d+$') { throw 'package_run_id must be numeric.' }
          $Run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PACKAGE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $Run.conclusion -ne 'success' -or $Run.path -ne '.github/workflows/release.yml') { throw 'Expected a successful package build run.' }
          gh run download $env:PACKAGE_RUN_ID --repo $env:GITHUB_REPOSITORY --pattern '*-windows-x64-portable' --dir .pangea-build/acceptance-download
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the existing portable artifact.' }
          $Packages = @(Get-ChildItem .pangea-build/acceptance-download -Recurse -Filter '*-portable.zip')
          if ($Packages.Count -ne 1) { throw 'Expected exactly one portable ZIP.' }
          $ExpectedHash = ((Get-Content "$($Packages[0].FullName).sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $Packages[0].FullName -Algorithm SHA256).Hash -ine $ExpectedHash) { throw 'Portable ZIP checksum mismatch.' }
          Expand-Archive $Packages[0].FullName .pangea-build/acceptance-package
      - name: Verify existing packaged Node and companion on Windows
        if: ${{ !cancelled() && inputs.package_run_id != '' }}
        shell: powershell
        run: |
          $Manifests = @(Get-ChildItem .pangea-build/acceptance-package -Recurse -Filter pangea-manifest.json)
          if ($Manifests.Count -ne 1) { throw 'Expected exactly one component manifest.' }
          $PackageRoot = Split-Path -Parent (Split-Path -Parent $Manifests[0].FullName)
          ./scripts/test-packaged-fault-injection.ps1 -PackageDirectory $PackageRoot -ReportPath .pangea-build/verification/fault-injection-packaged.json
      - name: Verify packaged HTTP compatibility with longpaths already enabled
        if: ${{ !cancelled() && inputs.package_run_id != '' }}
        shell: powershell
        run: |
          $Manifests = @(Get-ChildItem .pangea-build/acceptance-package -Recurse -Filter pangea-manifest.json)
          if ($Manifests.Count -ne 1) { throw 'Expected exactly one component manifest.' }
          $PackageRoot = Split-Path -Parent (Split-Path -Parent $Manifests[0].FullName)
          ./scripts/test-packaged-fault-injection.ps1 -PackageDirectory $PackageRoot -GitLongpathsDefault true -ReportPath .pangea-build/verification/fault-injection-packaged-enabled.json
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-fault-injection-compatibility
          path: .pangea-build/verification/
          if-no-files-found: warn
  tooling:
    if: inputs.native_zero_copy_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm
      - name: Install locked test dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Verify trust, discovery, retry and immutable publication logic
        # gh and pwsh are mocked by CLI tests; this job cannot publish a release.
        run: npm run test:release-tools
      - name: Verify online discovery, signed download and install handoff
        run: npx --no-install vitest run test/online-update.test.ts test/update-release-view.test.ts test/online-update-integration.test.ts test/intranet-update.test.ts test/intranet-release-workflow.test.ts test/update-state.test.ts test/update-ui.test.ts test/desktop-bridge.test.ts
      - name: Verify proactive network settings entry and isolated dialog
        run: npx --no-install vitest run test/update-network-entry.test.ts test/update-network-view.test.ts test/update-network.test.ts test/git-proxy-ipc.test.ts test/windows-titlebar.test.ts
      - name: Verify existing package and patch contracts
        run: npx --no-install vitest run test/release.test.ts test/semantic-staging.test.ts test/fault-injection-compat-gate.test.ts test/portable-patch.test.ts test/portable-patch-generation.test.ts test/portable-upgrade-policy.test.ts
  windows-updater:
    if: inputs.native_zero_copy_only != true
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Verify Windows PowerShell 5.1 recovery, data and process boundaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($Script in @(
            'scripts/verify-portable-update-transactions.ps1',
            'scripts/verify-portable-io-protection.ps1',
            'scripts/verify-portable-profile-rollback.ps1',
            'scripts/verify-portable-batch-cleanup.ps1',
            'scripts/verify-portable-handle-server.ps1',
            'scripts/verify-portable-update-locks.ps1',
            'scripts/verify-portable-patch-apply.ps1',
            'scripts/verify-portable-handle-resolution.ps1',
            'scripts/verify-explorer-recovery.ps1',
            'scripts/verify-portable-user-data.ps1',
            'scripts/verify-portable-long-paths.ps1',
            'scripts/verify-portable-rollback-start.ps1'
          )) {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $Script
            if ($LASTEXITCODE -ne 0) { throw "Windows updater regression failed: $Script" }
          }
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/verify-portable-update-progress.ps1 -FunctionsOnly
          if ($LASTEXITCODE -ne 0) { throw 'Updater progress ownership regression failed.' }
      - name: Verify import, health, recovery and task admission
        run: npx --no-install vitest run test/portable-update-health.test.ts test/portable-package-io.test.ts test/portable-update-recovery.test.ts test/portable-update-admission.test.ts test/portable-upgrade-policy.test.ts
  windows-zero-copy:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify real process crashes and data identity boundaries
        shell: powershell
        run: ./scripts/verify-portable-zero-copy.ps1
      - name: Verify production supervisor lifecycle with a native application fixture
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./scripts/verify-portable-update-lifecycle.ps1
      - name: Measure native 100k-file patch and 1 GiB user-data migration
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          ./scripts/measure-portable-zero-copy.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native zero-copy benchmark failed.' }
      - name: Retain native updater evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-zero-copy-evidence
          path: .pangea-build/verification/portable-zero-copy*.json
          if-no-files-found: warn
