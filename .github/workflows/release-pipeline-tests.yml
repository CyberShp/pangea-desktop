name: Release pipeline regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release*.yml
      - scripts/*release*.mjs
      - scripts/*historical*.mjs
      - scripts/create-signed-portable-package.mjs
      - test/github-update.test.ts
      - test/online-update-integration.test.ts
      - scripts/create-signed-portable-patch.mjs
      - build/portable-update-policy.json
      - build/apply-portable-update.ps1
      - scripts/*portable*.ps1
      - src/main/update/**
      - packages/dsh-pangea-product/update-admission.js
      - test/portable-*.test.ts
      - src/main/update/portable-update.ts
      - src/main/update/portable-*-validator.ts
      - test/portable-upgrade-policy.test.ts
      - test/*release*.mjs
      - test/*historical*.mjs
      - test/release.test.ts
      - test/portable-patch*.test.ts
  push:
    branches: [langgraph]
    paths:
      - .github/workflows/release*.yml
      - scripts/*release*.mjs
      - scripts/*historical*.mjs
      - scripts/create-signed-portable-package.mjs
      - test/github-update.test.ts
      - test/online-update-integration.test.ts
      - scripts/create-signed-portable-patch.mjs
      - build/portable-update-policy.json
      - build/apply-portable-update.ps1
      - scripts/*portable*.ps1
      - src/main/update/**
      - packages/dsh-pangea-product/update-admission.js
      - test/portable-*.test.ts
      - src/main/update/portable-update.ts
      - src/main/update/portable-*-validator.ts
      - test/portable-upgrade-policy.test.ts
      - test/*release*.mjs
      - test/*historical*.mjs
      - test/release.test.ts
      - test/portable-patch*.test.ts
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm
      - name: Install locked test dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Verify trust, discovery, retry and immutable publication logic
        # gh and pwsh are mocked by CLI tests; this job cannot publish a release.
        run: npm run test:release-tools
      - name: Verify online discovery, signed download and install handoff
        run: npx --no-install vitest run test/github-update.test.ts test/online-update-integration.test.ts test/update-state.test.ts test/update-ui.test.ts test/desktop-bridge.test.ts
      - name: Verify existing package and patch contracts
        run: npx --no-install vitest run test/release.test.ts test/portable-patch.test.ts test/portable-patch-generation.test.ts test/portable-upgrade-policy.test.ts
  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Verify Windows PowerShell 5.1 recovery, data and process boundaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($Script in @(
            'scripts/verify-portable-update-transactions.ps1',
            'scripts/verify-portable-io-protection.ps1',
            'scripts/verify-portable-profile-rollback.ps1',
            'scripts/verify-portable-batch-cleanup.ps1',
            'scripts/verify-portable-update-locks.ps1',
            'scripts/verify-portable-patch-apply.ps1',
            'scripts/verify-portable-handle-resolution.ps1',
            'scripts/verify-explorer-recovery.ps1',
            'scripts/verify-portable-user-data.ps1',
            'scripts/verify-portable-long-paths.ps1',
            'scripts/verify-portable-rollback-start.ps1'
          )) {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $Script
            if ($LASTEXITCODE -ne 0) { throw "Windows updater regression failed: $Script" }
          }
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/verify-portable-update-progress.ps1 -FunctionsOnly
          if ($LASTEXITCODE -ne 0) { throw 'Updater progress ownership regression failed.' }
      - name: Verify import, health, recovery and task admission
        run: npx --no-install vitest run test/portable-update-health.test.ts test/portable-package-io.test.ts test/portable-update-recovery.test.ts test/portable-update-admission.test.ts test/portable-upgrade-policy.test.ts
