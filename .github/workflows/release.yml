name: Build Windows package
run-name: PANGEA Desktop ${{ inputs.channel || 'test' }} ${{ inputs.version || '0.1.9' }}

on:
  push:
    branches:
      - build/test-0.1.9-218e36e
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel
        required: true
        default: test
        type: choice
        options:
          - test
          - release
      version:
        description: Base version for test builds or exact version for releases (SemVer)
        required: true
        default: 0.1.3
        type: string
      patch_from_version:
        description: Optional exact version to generate a patch from (must be the immediately previous release)
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PANGEA_UPDATE_KEY_PASSPHRASE: ${{ secrets.PANGEA_UPDATE_KEY_PASSPHRASE }}
    steps:
      - name: Check out PANGEA Desktop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm

      - name: Prepare release secrets and version
        id: release_meta
        shell: pwsh
        env:
          BUILD_CHANNEL: ${{ inputs.channel || 'test' }}
          REQUESTED_VERSION: ${{ inputs.version || '0.1.9' }}
          PATCH_FROM_VERSION: ${{ inputs.patch_from_version || '' }}
          UPDATE_PRIVATE_KEY_B64: ${{ secrets.PANGEA_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          if ($env:REQUESTED_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Invalid base version: $env:REQUESTED_VERSION"
          }
          if ($env:BUILD_CHANNEL -eq 'test') {
            $ShortSha = $env:GITHUB_SHA.Substring(0, 7)
            $ResolvedVersion = "$env:REQUESTED_VERSION-test.$env:GITHUB_RUN_NUMBER.$ShortSha"
            $PackageChannel = 'test'
            $ReleaseTitle = "PANGEA Desktop test $ResolvedVersion"
          } elseif ($env:BUILD_CHANNEL -eq 'release') {
            $ResolvedVersion = $env:REQUESTED_VERSION
            $PackageChannel = 'stable'
            $ReleaseTitle = "PANGEA Desktop $ResolvedVersion"
          } else {
            throw "Unsupported build channel: $env:BUILD_CHANNEL"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:PATCH_FROM_VERSION)) {
            $ExpectedPatchPattern = if ($env:BUILD_CHANNEL -eq 'release') {
              '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
            } else {
              '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-test\.(0|[1-9]\d*)\.[0-9a-f]{7}$'
            }
            if ($env:PATCH_FROM_VERSION -notmatch $ExpectedPatchPattern) {
              throw "Patch base version $env:PATCH_FROM_VERSION does not match the $env:BUILD_CHANNEL channel."
            }
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY_B64)) {
            throw 'PANGEA_UPDATE_PRIVATE_KEY_B64 is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PANGEA_UPDATE_KEY_PASSPHRASE)) {
            throw 'PANGEA_UPDATE_KEY_PASSPHRASE is not configured.'
          }
          New-Item .pangea-keys -ItemType Directory -Force | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $PWD '.pangea-keys/update-private.pem'),
            [Convert]::FromBase64String($env:UPDATE_PRIVATE_KEY_B64)
          )
          "RELEASE_VERSION=$ResolvedVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PANGEA_PACKAGE_CHANNEL=$PackageChannel" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$ResolvedVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$ResolvedVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "title=$ReleaseTitle" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          npm version $ResolvedVersion --no-git-tag-version --allow-same-version

      - name: Assemble and validate portable package
        shell: pwsh
        run: |
          ./scripts/build-pangea-desktop.ps1 `
            -RequireCurrentComponentHeads `
            -UpdatePrivateKeyPath ./.pangea-keys/update-private.pem

      - name: Start packaged Harness with a migrated profile
        shell: pwsh
        timeout-minutes: 8
        run: |
          ./scripts/test-packaged-harness-startup.ps1 `
            -PackageDirectory ./dist/win-unpacked `
            -ExpectedVersion $env:RELEASE_VERSION

      - name: Generate signed incremental patch
        if: inputs.patch_from_version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_FROM_VERSION: ${{ inputs.patch_from_version }}
          TARGET_VERSION: ${{ steps.release_meta.outputs.version }}
          PACKAGE_CHANNEL: ${{ inputs.channel == 'release' && 'stable' || 'test' }}
        run: |
          $BaseName = "pangea-desktop-$env:PATCH_FROM_VERSION-windows-x64-portable.zip"
          New-Item .pangea-base -ItemType Directory -Force | Out-Null
          gh release download "v$env:PATCH_FROM_VERSION" `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $BaseName `
            --dir .pangea-base `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download base release v$env:PATCH_FROM_VERSION." }
          Expand-Archive (Join-Path $PWD ".pangea-base/$BaseName") -DestinationPath .pangea-base/unpacked -Force
          $PatchName = "pangea-desktop-$env:TARGET_VERSION-from-$env:PATCH_FROM_VERSION-windows-x64.patch.zip"
          node scripts/create-signed-portable-patch.mjs `
            --base-dir ./.pangea-base/unpacked `
            --target-dir ./dist/win-unpacked `
            --private-key ./.pangea-keys/update-private.pem `
            --from-version $env:PATCH_FROM_VERSION `
            --to-version $env:TARGET_VERSION `
            --channel $env:PACKAGE_CHANNEL `
            --output "./dist/$PatchName"
          if ($LASTEXITCODE -ne 0) { throw 'Incremental patch generation failed.' }
          $PatchPath = Resolve-Path "./dist/$PatchName"
          $PatchHash = (Get-FileHash $PatchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$PatchPath.sha256" "$PatchHash  $PatchName" -Encoding ASCII

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pangea-desktop-${{ steps.release_meta.outputs.version }}-windows-x64-portable
          path: |
            dist/pangea-desktop-*
          if-no-files-found: error
          retention-days: 14

      - name: Validate legacy in-app upgrade to 0.1.3
        if: inputs.channel == 'release' && inputs.version == '0.1.3'
        shell: pwsh
        timeout-minutes: 6
        run: |
          ./scripts/test-legacy-portable-upgrade.ps1 `
            -PackagePath ./dist/pangea-desktop-0.1.3-windows-x64-portable.zip `
            -ExpectedVersion 0.1.3

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_CHANNEL: ${{ inputs.channel || 'test' }}
          PATCH_FROM_VERSION: ${{ inputs.patch_from_version || '' }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.title }}
        run: |
          $PackageName = "pangea-desktop-$env:RELEASE_VERSION-windows-x64-portable.zip"
          $PackagePath = (Resolve-Path "dist/$PackageName").Path
          $HashPath = (Resolve-Path "dist/$PackageName.sha256").Path
          $ReleaseAssets = @($PackagePath, $HashPath)
          $PatchAssets = @(Get-ChildItem "dist/pangea-desktop-$env:RELEASE_VERSION-from-*.patch.zip*" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          $ReleaseAssets += $PatchAssets
          $Notes = @"
          PANGEA Desktop $env:RELEASE_VERSION

          Source commit: $env:GITHUB_SHA
          Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Patch base: $env:PATCH_FROM_VERSION
          "@

          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $ReleaseExists = $LASTEXITCODE -eq 0
          & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" --silent *> $null
          $TagExists = $LASTEXITCODE -eq 0

          if ($env:BUILD_CHANNEL -eq 'release' -and ($ReleaseExists -or $TagExists)) {
            throw "Release version already exists: $env:RELEASE_TAG"
          }

          if ($ReleaseExists) {
            & gh release upload $env:RELEASE_TAG @ReleaseAssets `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          } else {
            $CreateArguments = @('release', 'create', $env:RELEASE_TAG)
            $CreateArguments += $ReleaseAssets
            $CreateArguments += @(
              '--repo', $env:GITHUB_REPOSITORY,
              '--target', $env:GITHUB_SHA,
              '--title', $env:RELEASE_TITLE,
              '--notes', $Notes
            )
            if ($env:BUILD_CHANNEL -eq 'test') {
              $CreateArguments += '--prerelease'
            }
            & gh @CreateArguments
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publish failed with exit code $LASTEXITCODE." }
