name: Build Windows package
run-name: PANGEA Desktop ${{ inputs.mode || 'build' }} ${{ inputs.channel || 'test' }} ${{ inputs.version || '2.0.21' }}

on:
  push:
    branches:
      - feat/module-analysis-five-stages
      - langgraph
    paths:
      - .github/module-analysis-build-trigger
      - .github/langgraph-build-trigger
  workflow_dispatch:
    inputs:
      mode:
        description: Build a new target, or backfill patches for an existing target release
        required: true
        default: build
        type: choice
        options:
          - build
          - backfill
      channel:
        description: Target release channel
        required: true
        default: test
        type: choice
        options:
          - test
          - release
      version:
        description: Build mode uses a base SemVer; backfill requires the exact existing target version
        required: true
        default: 2.0.21
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    # Historical bases are verified serially; never silently truncate the release history.
    timeout-minutes: 360
    env:
      PANGEA_UPDATE_KEY_PASSPHRASE: ${{ secrets.PANGEA_UPDATE_KEY_PASSPHRASE }}
    steps:
      - name: Check out PANGEA Desktop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm

      - name: Test release version preflight
        shell: pwsh
        run: |
          node --test test/release-version-check.test.mjs test/historical-releases.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release version preflight tests failed.' }

      - name: Reject occupied release version before building
        if: (inputs.mode || 'build') == 'build' && inputs.channel == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version || '2.0.21' }}
        run: |
          node scripts/assert-release-version-available.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release preflight failed before building. See the version or API error above.' }

      - name: Resolve target version and mode
        id: release_meta
        shell: pwsh
        env:
          RELEASE_MODE: ${{ inputs.mode || 'build' }}
          BUILD_CHANNEL: ${{ inputs.channel || 'test' }}
          REQUESTED_VERSION: ${{ inputs.version || '2.0.21' }}
        run: |
          $StableVersionPattern = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
          $TestVersionPattern = '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-test\.(0|[1-9]\d*)\.[0-9a-f]{7}$'
          if ($env:RELEASE_MODE -notin @('build', 'backfill')) {
            throw "Unsupported release mode: $env:RELEASE_MODE"
          }
          if ($env:BUILD_CHANNEL -eq 'test') {
            $PackageChannel = 'test'
          } elseif ($env:BUILD_CHANNEL -eq 'release') {
            $PackageChannel = 'stable'
          } else {
            throw "Unsupported build channel: $env:BUILD_CHANNEL"
          }
          if ($env:RELEASE_MODE -eq 'backfill') {
            $ExpectedPattern = if ($PackageChannel -eq 'stable') { $StableVersionPattern } else { $TestVersionPattern }
            if ($env:REQUESTED_VERSION -cnotmatch $ExpectedPattern) {
              throw "Backfill requires an exact existing $PackageChannel version: $env:REQUESTED_VERSION"
            }
            $ResolvedVersion = $env:REQUESTED_VERSION
          } else {
            if ($env:REQUESTED_VERSION -notmatch $StableVersionPattern) {
              throw "Build mode requires a base SemVer: $env:REQUESTED_VERSION"
            }
            if ($PackageChannel -eq 'test') {
              $ShortSha = $env:GITHUB_SHA.Substring(0, 7)
              $ResolvedVersion = "$env:REQUESTED_VERSION-test.$env:GITHUB_RUN_NUMBER.$ShortSha"
            } else {
              $ResolvedVersion = $env:REQUESTED_VERSION
            }
          }
          $ReleaseTitle = if ($PackageChannel -eq 'test') { "PANGEA Desktop test $ResolvedVersion" } else { "PANGEA Desktop $ResolvedVersion" }
          "RELEASE_VERSION=$ResolvedVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PANGEA_PACKAGE_CHANNEL=$PackageChannel" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_MODE=$env:RELEASE_MODE" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "mode=$env:RELEASE_MODE" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "channel=$PackageChannel" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$ResolvedVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$ResolvedVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "title=$ReleaseTitle" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Reject occupied test version before building
        if: steps.release_meta.outputs.mode == 'build' && steps.release_meta.outputs.channel == 'test'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          node scripts/assert-release-version-available.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Test version is occupied or its availability could not be verified. Existing assets will not be overwritten.' }

      - name: Prepare update signing key
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY_B64: ${{ secrets.PANGEA_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY_B64)) {
            throw 'PANGEA_UPDATE_PRIVATE_KEY_B64 is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PANGEA_UPDATE_KEY_PASSPHRASE)) {
            throw 'PANGEA_UPDATE_KEY_PASSPHRASE is not configured.'
          }
          New-Item .pangea-keys -ItemType Directory -Force | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $PWD '.pangea-keys/update-private.pem'),
            [Convert]::FromBase64String($env:UPDATE_PRIVATE_KEY_B64)
          )

      - name: Set new package version
        if: steps.release_meta.outputs.mode == 'build'
        shell: pwsh
        run: |
          npm version $env:RELEASE_VERSION --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { throw 'Could not set the new package version.' }

      - name: Assemble and validate portable package
        if: steps.release_meta.outputs.mode == 'build'
        shell: pwsh
        run: |
          ./scripts/build-pangea-desktop.ps1 `
            -RequireCurrentComponentHeads `
            -UpdatePrivateKeyPath ./.pangea-keys/update-private.pem

      - name: Start packaged Harness with a migrated profile
        if: steps.release_meta.outputs.mode == 'build'
        shell: pwsh
        timeout-minutes: 8
        run: |
          ./scripts/test-packaged-harness-startup.ps1 `
            -PackageDirectory ./dist/win-unpacked `
            -ExpectedVersion $env:RELEASE_VERSION

      - name: Verify packaged Cordis analysis launch
        if: steps.release_meta.outputs.mode == 'build'
        shell: pwsh
        run: |
          $env:PANGEA_TEST_APP_ROOT = (Resolve-Path './dist/win-unpacked/resources/app').Path
          $PackagedNode = Join-Path $env:PANGEA_TEST_APP_ROOT 'node_modules/node/bin/node.exe'
          $IntegrationTest = Join-Path $env:PANGEA_TEST_APP_ROOT 'node_modules/dsh-pangea-companion/tests/cordis-launch.integration.mjs'
          & $PackagedNode --test $IntegrationTest
          if ($LASTEXITCODE -ne 0) { throw "Packaged Cordis integration failed with exit code $LASTEXITCODE." }

      - name: Install locked patch tooling for backfill
        if: steps.release_meta.outputs.mode == 'backfill'
        shell: pwsh
        run: |
          # No product build or package lifecycle scripts run in backfill mode.
          npm ci --ignore-scripts --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the locked patch tooling dependencies.' }

      - name: Test package trust and patch tooling
        shell: pwsh
        run: |
          node --test test/release-package-trust.test.mjs test/historical-releases.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Package trust or historical patch tests failed.' }

      - name: Generate and verify patches from release history
        id: historical_patches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/build-historical-patches.mjs `
            --target-version $env:RELEASE_VERSION `
            --channel $env:PANGEA_PACKAGE_CHANNEL `
            --private-key ./.pangea-keys/update-private.pem `
            --mode $env:RELEASE_MODE `
            --output-dir ./dist
          if ($LASTEXITCODE -ne 0) { throw 'Historical patch generation or verification failed. See the patch report artifact; no release assets were published.' }

      - name: Upload historical patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pangea-desktop-${{ steps.release_meta.outputs.version || inputs.version || 'unknown' }}-patch-report-${{ github.run_attempt }}
          path: dist/pangea-desktop-*-patch-report-*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pangea-desktop-${{ steps.release_meta.outputs.version }}-windows-x64-portable
          path: |
            dist/pangea-desktop-*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: steps.release_meta.outputs.mode == 'build'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.title }}
          REQUESTED_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          node scripts/assert-release-version-available.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Version availability changed during the build. Existing releases and tags will not be overwritten.' }
          $PackageName = "pangea-desktop-$env:RELEASE_VERSION-windows-x64-portable.zip"
          $PackagePath = (Resolve-Path "dist/$PackageName").Path
          $HashPath = (Resolve-Path "dist/$PackageName.sha256").Path
          $ReleaseAssets = @($PackagePath, $HashPath)
          $PatchAssets = @(node scripts/list-release-patch-assets.mjs --version $env:RELEASE_VERSION --directory ./dist)
          if ($LASTEXITCODE -ne 0) { throw 'Historical patch publication validation failed.' }
          $ReleaseAssets += $PatchAssets
          $MinimumUpgradeSource = (Get-Content ./build/portable-update-policy.json -Raw | ConvertFrom-Json).minimum_source_version
          $Notes = @"
          PANGEA Desktop $env:RELEASE_VERSION

          Source commit: $env:GITHUB_SHA
          Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Historical patch coverage and exclusions: see the attached patch report.
          Minimum supported in-app upgrade source: $MinimumUpgradeSource. Each patch requires its exact base version.
          Older installations require a separate complete-package installation; preserve their original directory and user data.
          "@
          $CreateArguments = @('release', 'create', $env:RELEASE_TAG)
          $CreateArguments += $ReleaseAssets
          $CreateArguments += @(
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', $env:RELEASE_TITLE,
            '--notes', $Notes
          )
          if ($env:PANGEA_PACKAGE_CHANNEL -eq 'test') {
            $CreateArguments += '--prerelease'
          }
          & gh @CreateArguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publish failed with exit code $LASTEXITCODE." }

      - name: Add verified patches to existing release
        if: steps.release_meta.outputs.mode == 'backfill'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-release-additions.mjs --version $env:RELEASE_VERSION --directory ./dist
          if ($LASTEXITCODE -ne 0) { throw 'Backfill publication failed. Existing assets were not overwritten; inspect the conflict or API error above.' }

      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .pangea-keys/update-private.pem) {
            Remove-Item -LiteralPath .pangea-keys/update-private.pem -Force
          }
