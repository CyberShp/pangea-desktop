name: Product release placeholder

# Final Windows artifacts contain internal component commits. The cloud-hosted
# repository must not build or publish them. A future internal/self-hosted
# runner may replace this placeholder after its artifact destination and code
# signing contract are configured.
on: []

permissions:
  contents: read

jobs:
  disabled:
    if: ${{ false }}
    runs-on: windows-2022
    steps:
      - run: Write-Host 'PANGEA Desktop release is owned by the internal Windows pipeline.'
