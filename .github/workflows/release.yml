name: Build Windows package
run-name: PANGEA Desktop ${{ inputs.channel }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel
        required: true
        default: test
        type: choice
        options:
          - test
          - release
      version:
        description: Base version for test builds or exact version for releases (SemVer)
        required: true
        default: 0.1.3
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PANGEA_UPDATE_KEY_PASSPHRASE: ${{ secrets.PANGEA_UPDATE_KEY_PASSPHRASE }}
    steps:
      - name: Check out PANGEA Desktop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm

      - name: Prepare release secrets and version
        id: release_meta
        shell: pwsh
        env:
          BUILD_CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
          UPDATE_PRIVATE_KEY_B64: ${{ secrets.PANGEA_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          if ($env:REQUESTED_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Invalid base version: $env:REQUESTED_VERSION"
          }
          if ($env:BUILD_CHANNEL -eq 'test') {
            $ShortSha = $env:GITHUB_SHA.Substring(0, 7)
            $ResolvedVersion = "$env:REQUESTED_VERSION-test.$env:GITHUB_RUN_NUMBER.$ShortSha"
            $ReleaseTitle = "PANGEA Desktop test $ResolvedVersion"
          } elseif ($env:BUILD_CHANNEL -eq 'release') {
            $ResolvedVersion = $env:REQUESTED_VERSION
            $ReleaseTitle = "PANGEA Desktop $ResolvedVersion"
          } else {
            throw "Unsupported build channel: $env:BUILD_CHANNEL"
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY_B64)) {
            throw 'PANGEA_UPDATE_PRIVATE_KEY_B64 is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PANGEA_UPDATE_KEY_PASSPHRASE)) {
            throw 'PANGEA_UPDATE_KEY_PASSPHRASE is not configured.'
          }
          New-Item .pangea-keys -ItemType Directory -Force | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $PWD '.pangea-keys/update-private.pem'),
            [Convert]::FromBase64String($env:UPDATE_PRIVATE_KEY_B64)
          )
          "RELEASE_VERSION=$ResolvedVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$ResolvedVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$ResolvedVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "title=$ReleaseTitle" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          npm version $ResolvedVersion --no-git-tag-version --allow-same-version

      - name: Assemble and validate portable package
        shell: pwsh
        run: |
          ./scripts/build-pangea-desktop.ps1 `
            -UpdatePrivateKeyPath ./.pangea-keys/update-private.pem

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pangea-desktop-${{ steps.release_meta.outputs.version }}-windows-x64-portable
          path: |
            dist/pangea-desktop-${{ steps.release_meta.outputs.version }}-windows-x64-portable.zip
            dist/pangea-desktop-${{ steps.release_meta.outputs.version }}-windows-x64-portable.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release_meta.outputs.title }}
        run: |
          $PackageName = "pangea-desktop-$env:RELEASE_VERSION-windows-x64-portable.zip"
          $PackagePath = (Resolve-Path "dist/$PackageName").Path
          $HashPath = (Resolve-Path "dist/$PackageName.sha256").Path
          $Notes = @"
          PANGEA Desktop $env:RELEASE_VERSION

          Source commit: $env:GITHUB_SHA
          Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@

          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $ReleaseExists = $LASTEXITCODE -eq 0
          & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" --silent *> $null
          $TagExists = $LASTEXITCODE -eq 0

          if ($env:BUILD_CHANNEL -eq 'release' -and ($ReleaseExists -or $TagExists)) {
            throw "Release version already exists: $env:RELEASE_TAG"
          }

          if ($ReleaseExists) {
            & gh release upload $env:RELEASE_TAG $PackagePath $HashPath `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          } else {
            $CreateArguments = @(
              'release', 'create', $env:RELEASE_TAG,
              $PackagePath, $HashPath,
              '--repo', $env:GITHUB_REPOSITORY,
              '--target', $env:GITHUB_SHA,
              '--title', $env:RELEASE_TITLE,
              '--notes', $Notes
            )
            if ($env:BUILD_CHANNEL -eq 'test') {
              $CreateArguments += '--prerelease'
            }
            & gh @CreateArguments
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publish failed with exit code $LASTEXITCODE." }

      - name: Upload package to artifact server
        shell: pwsh
        env:
          ARTIFACT_HOST: ${{ secrets.PANGEA_ARTIFACT_HOST }}
          ARTIFACT_SSH_KEY_B64: ${{ secrets.PANGEA_ARTIFACT_SSH_KEY_B64 }}
          ARTIFACT_KNOWN_HOSTS: ${{ secrets.PANGEA_ARTIFACT_KNOWN_HOSTS }}
        run: |
          foreach ($Name in @('ARTIFACT_HOST', 'ARTIFACT_SSH_KEY_B64', 'ARTIFACT_KNOWN_HOSTS')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($Name))) {
              throw "$Name is not configured."
            }
          }
          if (-not (Get-Command sftp -ErrorAction SilentlyContinue)) {
            throw 'The Windows runner does not provide the OpenSSH SFTP client.'
          }
          $SshRoot = Join-Path $env:RUNNER_TEMP 'pangea-artifact-ssh'
          New-Item $SshRoot -ItemType Directory -Force | Out-Null
          $KeyPath = Join-Path $SshRoot 'id_ed25519'
          $KnownHostsPath = Join-Path $SshRoot 'known_hosts'
          $BatchPath = Join-Path $SshRoot 'upload.sftp'
          [IO.File]::WriteAllBytes($KeyPath, [Convert]::FromBase64String($env:ARTIFACT_SSH_KEY_B64))
          $CurrentUser = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          & icacls $KeyPath /inheritance:r /grant:r "${CurrentUser}:(R)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not restrict the artifact SSH key permissions.' }
          [IO.File]::WriteAllText($KnownHostsPath, "$env:ARTIFACT_KNOWN_HOSTS`n")
          $PackageName = "pangea-desktop-$env:RELEASE_VERSION-windows-x64-portable.zip"
          $PackagePath = (Resolve-Path "dist/$PackageName").Path.Replace('\', '/')
          $HashPath = (Resolve-Path "dist/$PackageName.sha256").Path.Replace('\', '/')
          $RemotePackagePath = "/uploads/$PackageName"
          $RemoteHashPath = "$RemotePackagePath.sha256"
          $PendingSuffix = ".pending.$env:GITHUB_RUN_ID"
          @(
            "put `"$PackagePath`" `"$RemotePackagePath$PendingSuffix`""
            "put `"$HashPath`" `"$RemoteHashPath$PendingSuffix`""
            "rename `"$RemotePackagePath$PendingSuffix`" `"$RemotePackagePath`""
            "rename `"$RemoteHashPath$PendingSuffix`" `"$RemoteHashPath`""
          ) | Set-Content $BatchPath -Encoding ASCII
          & sftp `
            -b $BatchPath `
            -i $KeyPath `
            -o BatchMode=yes `
            -o ConnectTimeout=20 `
            -o IdentitiesOnly=yes `
            -o ServerAliveInterval=30 `
            -o ServerAliveCountMax=6 `
            -o StrictHostKeyChecking=yes `
            -o "UserKnownHostsFile=$KnownHostsPath" `
            "pangea-artifact@$env:ARTIFACT_HOST"
          if ($LASTEXITCODE -ne 0) { throw "SFTP upload failed with exit code $LASTEXITCODE." }
