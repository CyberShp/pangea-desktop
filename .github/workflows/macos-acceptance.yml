name: Build macOS acceptance

on:
  push:
    branches: [codex/macos-arm64-acceptance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PANGEA_PACKAGE_CHANNEL: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: npm
      - name: Install locked native dependencies
        run: npm ci --legacy-peer-deps
      - name: Set acceptance version
        run: npm version "2.1.4-macaccept.${{ github.run_number }}" --no-git-tag-version
      - name: Check platform and packaging contracts
        run: |
          node --test test/pangea-staging.test.mjs test/packaged-macos.test.mjs
          npm test -- --run test/pangea-product.test.ts test/launch-root.test.ts test/user-data-path.test.ts
      - name: Assemble and verify macOS application
        run: node scripts/build-pangea-macos.mjs
      - name: Upload runnable acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: pangea-desktop-macos-arm64-acceptance
          path: dist-macos/delivery/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-acceptance-evidence
          path: |
            .pangea-build/manifest.json
            .pangea-build/macos-acceptance-parent/evidence/
          if-no-files-found: warn
          retention-days: 14
