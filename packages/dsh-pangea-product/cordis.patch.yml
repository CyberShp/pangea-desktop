- id: llm-deepseek
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: tool-web
  config:
    search: false

- id: agent-default-model
  config:
    provider: ''
    model: ''

- insert:
    - id: pangea-product-shell
      name: dsh-pangea-product
    - id: better-sidebar
      name: dsh-better-sidebar
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-better-sidebar' && e.options.id !== 'better-sidebar' && !e.disabled)"
    - id: pangea-workbench
      name: dsh-pangea
    - id: pangea-companion
      name: dsh-pangea-companion
    - id: pangea-report-policy
      name: dsh-pangea-companion/report-policy
    - id: pangea-asset-catalog
      name: dsh-pangea-asset-catalog
