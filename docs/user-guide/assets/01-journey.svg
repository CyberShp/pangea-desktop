cle cx="40" cy="42" r="19" fill="#245d49"/><text x="40" y="49" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">4</text><text x="72" y="50" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="600" fill="#182b23">查看进度</text><text x="24" y="104" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#56645e">阅读产出，处理需要确认的事项</text></g><g transform="translate(464 268)"><rect width="392" height="142" rx="16" fill="white" stroke="#dce5df"/><circle cx="40" cy="42" r="19" fill="#245d49"/><text x="40" y="49" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">5</text><text x="72" y="50" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="600" fill="#182b23">阅读结果</text><text x="24" y="104" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#56645e">核对流程、风险、证据与报告</text></g><g transform="translate(880 268)"><rect width="392" height="142" rx="16" fill="white" stroke="#dce5df"/><circle cx="40" cy="42" r="19" fill="#245d49"/><text x="40" y="49" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="white">6</text><text x="72" y="50" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="600" fill="#182b23">评审与导出</text><text x="24" y="104" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="20" fill="#56645e">采纳适用用例，按范围导出表格</text></g><text x="48" y="452" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#607369">从一个熟悉的小模块开始，先走通一次完整流程。</text></svg>